# Deterministic checks on every push and pull request: typecheck, the unit, injection and fixture tests (real READMEs
# in tests/fixtures, offline), and that the committed dist/ is what src/ builds to.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun x vitest run
      - name: dist matches src
        run: bun x tsc -p tsconfig.build.json && git diff --exit-code -- dist
